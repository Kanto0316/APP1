name: Build MVolaCash Admin APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper bootstrap JAR
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MVolaCash-Admin-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
